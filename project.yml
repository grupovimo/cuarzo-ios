# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: Cuarzo
options:
  bundleIdPrefix: ar.com.cuarzo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Cuarzo:
    type: application
    platform: iOS
    sources:
      - path: Cuarzo
        excludes: [Recursos/PrivacyInfo.xcprivacy]
      # El manifiesto de privacidad (lo pide App Store Connect): como recurso, explícito.
      - path: Cuarzo/Recursos/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.cuarzo.app
        PRODUCT_NAME: Cuarzo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          # TestFlight por GitHub Actions con firma manual.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.cuarzo.app App Store
    info:
      path: Cuarzo/Info.plist
      properties:
        CFBundleDisplayName: Cuarzo
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Medium.ttf
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Lanzamiento
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Para entrar a tu cuenta y confirmar pagos sin escribir la clave.
        NSCameraUsageDescription: Para escanear QR de pago y sacar las fotos de tu DNI.
        ITSAppUsesNonExemptEncryption: false
  CuarzoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CuarzoTests]
    dependencies:
      - target: Cuarzo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cuarzo:
    build:
      targets:
        Cuarzo: all
        CuarzoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CuarzoTests]
